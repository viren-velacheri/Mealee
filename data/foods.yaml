# 30 classes chosen for what is actually at the expo and in CMU dining halls.
#
# fdc_id values are USDA SR Legacy identifiers entered from reference and NOT yet
# checked against data/usda.sqlite, because the FDC download host is unreachable from
# the container these were written in. Run `make verify-foods` after the Friday night
# USDA download. It prints every id that does not resolve and every description that
# looks unrelated to its label. Fix those before trusting any gram number.
#
# height_prior_mm is the assumed depth of the item as plated, seen from above.
# density is g/cm3 as served. mass_g = area_mm2 * height_prior_mm / 1000 * density.
# added_sugar_share is the fraction of item mass that counts as added sugar.
# veg is true only for actual vegetables. Fruit is deliberately excluded, because the
# defense stat targets 400 g of vegetables and counting an apple toward it would let a
# fruit-only day read as a well defended fighter.

foods:
  - label: pizza slice
    fdc_id: 170035
    height_prior_mm: 12
    density: 0.75
    veg: false
    added_sugar_share: 0.01
    caffeine_mg_per_100g: 0


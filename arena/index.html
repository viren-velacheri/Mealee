<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mealee Arena</title>
<style>
  :root {
    --mist: #f7fff6; --mint: #bcebcb; --leaf: #87d68d; --sage: #93b48b; --slate: #8491a3; --ink: #1e2a22;
    --glass: rgba(255,255,255,0.55); --line: rgba(255,255,255,0.9); --shadow: 0 18px 44px rgba(147,180,139,0.22);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    color: var(--ink); background: var(--mist);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "SF Pro Display", Inter, system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; padding: 28px 36px; gap: 22px; position: relative;
  }
  .aurora { position: fixed; inset: -20%; z-index: -1; filter: blur(60px); opacity: 0.9;
    background:
      radial-gradient(38% 42% at 22% 24%, var(--mint) 0%, transparent 70%),
      radial-gradient(34% 36% at 78% 58%, rgba(135,214,141,0.55) 0%, transparent 70%),
      radial-gradient(40% 30% at 46% 96%, rgba(147,180,139,0.45) 0%, transparent 70%);
    animation: drift 26s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(0,0) rotate(0deg) scale(1); } to { transform: translate(3%, -4%) rotate(3deg) scale(1.06); } }
  header { display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  header h1 span { color: var(--slate); font-weight: 500; }
  .code { font-size: 46px; font-weight: 800; letter-spacing: 0.22em; color: var(--ink);
    background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    padding: 6px 28px 6px 36px; border-radius: 999px; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .status { font-size: 15px; font-weight: 600; color: var(--slate); display: flex; align-items: center; gap: 8px; }
  .status::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--slate); }
  .status.live::before { background: var(--leaf); box-shadow: 0 0 0 6px rgba(135,214,141,0.25); }
  main { display: grid; grid-template-columns: 1fr 1.9fr 1fr; gap: 22px; min-height: 0; }
  .card { background: var(--glass); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    border: 1px solid var(--line); border-radius: 30px; box-shadow: var(--shadow); padding: 26px; min-height: 0; }
  .fighter { display: flex; flex-direction: column; gap: 14px; transition: transform .35s cubic-bezier(.2,1.4,.4,1); }
  .fighter.hit { animation: shake .4s ease-out; }
  @keyframes shake { 0%{transform:translateX(0)} 25%{transform:translateX(-10px) rotate(-1.5deg)} 55%{transform:translateX(7px) rotate(1deg)} 100%{transform:translateX(0)} }
  .fighter .emoji { font-size: 104px; line-height: 1; text-align: center; transition: transform .3s cubic-bezier(.2,1.4,.4,1), filter .4s; }
  .fighter.crash .emoji { filter: grayscale(1) opacity(.7); transform: scale(.88); }
  .fighter.ko .emoji { filter: grayscale(1) opacity(.5); transform: scale(.7) rotate(12deg); }
  .fighter .name { font-size: 30px; font-weight: 800; text-align: center; }
  .side-a .name { color: #4f8f55; } .side-b .name { color: #6a7d64; }
  .hpwrap { height: 22px; background: rgba(188,235,203,0.45); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); position: relative; }
  .hp { height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--leaf), var(--mint));
    transition: width .5s cubic-bezier(.2,1.2,.4,1), background .3s; position: relative; overflow: hidden; }
  .hp.low { background: linear-gradient(90deg, var(--sage), var(--slate)); }
  .hp::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
    transform: translateX(-100%); animation: shimmer 2.6s linear infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .hpnum { font-size: 22px; font-variant-numeric: tabular-nums; text-align: center; color: var(--slate); font-weight: 700; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; font-size: 17px; }
  .stats div { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(132,145,163,0.18); padding: 5px 0; color: var(--slate); }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .stats .tag { color: #4f8f55; font-weight: 700; border: none; }
  .centre { display: flex; flex-direction: column; gap: 16px; }
  .callout { text-align: center; font-size: 42px; font-weight: 800; min-height: 64px; letter-spacing: -0.01em;
    transition: transform .3s cubic-bezier(.2,1.5,.4,1), color .3s; }
  .callout.pop { animation: pop .45s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { 0% { transform: scale(1.7); text-shadow: 0 0 24px var(--leaf); opacity: .3 } 100% { transform: scale(1); text-shadow: none; opacity: 1 } }
  .callout.crash { color: #6a7d64; } .callout.win { color: #3f8a47; font-size: 58px; }
  .log { flex: 1; overflow-y: auto; font-size: 21px; line-height: 1.6; font-variant-numeric: tabular-nums; padding-right: 6px; }
  .log div { padding: 5px 12px; border-left: 4px solid transparent; border-radius: 10px; animation: rise .35s cubic-bezier(.2,1.2,.4,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .log .a { border-color: var(--leaf); } .log .b { border-color: var(--sage); }
  .log .turn { color: var(--slate); display: inline-block; width: 52px; font-weight: 700; }
  .log .latest { background: rgba(188,235,203,0.35); }
  .log .cursor { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--leaf); box-shadow: 0 0 10px var(--leaf); margin-left: 4px; vertical-align: middle; }
  .standings { display: flex; flex-direction: column; gap: 12px; }
  .standings h2 { font-size: 14px; color: var(--slate); text-transform: uppercase; letter-spacing: .14em; font-weight: 800; }
  .standings .row { display: grid; grid-template-columns: 30px 44px 1fr auto; align-items: center; gap: 10px; font-size: 21px;
    background: rgba(255,255,255,0.35); border-radius: 16px; padding: 8px 12px; }
  .standings .row .rank { color: var(--slate); font-weight: 800; }
  .standings .row .wins { font-weight: 800; }
  .standings .row small { color: var(--slate); font-size: 14px; margin-left: 6px; font-weight: 600; }
  .tonight { margin-top: 6px; font-size: 17px; color: var(--slate); font-weight: 600; }
  .tonight div { padding: 3px 0; }
  footer { font-size: 14px; color: var(--slate); display: flex; justify-content: space-between; font-weight: 600; }
  .empty { text-align: center; color: var(--slate); font-size: 24px; margin-top: 28vh; font-weight: 600; }
  .burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .burst i { position: absolute; left: 50%; top: 42%; width: 12px; height: 12px; border-radius: 50%; animation: fly 1.3s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
</style>
</head>
<body>
<div class="aurora"></div>
<header>
  <h1>Mealee <span>arena</span></h1>
  <div class="code" id="code">····</div>
  <div class="status" id="status">connecting</div>
</header>
<main>
  <section class="card fighter side-a" id="fa">
    <div class="emoji">🍽️</div><div class="name">waiting</div>
    <div class="hpwrap"><div class="hp"></div></div><div class="hpnum">—</div>
    <div class="stats"></div>
  </section>
  <section class="card centre">
    <div class="callout" id="callout">Waiting for a fight</div>
    <div class="log" id="log"><div class="empty">Tap Quick match on a phone</div></div>
  </section>
  <aside class="card standings">
    <h2>Standings this week</h2>
    <div id="standings"></div>
    <div class="tonight" id="tonight"></div>
    <section class="card fighter side-b" id="fb" style="margin-top:auto;padding:18px">
      <div class="emoji">🍽️</div><div class="name">waiting</div>
      <div class="hpwrap"><div class="hp"></div></div><div class="hpnum">—</div>
      <div class="stats"></div>
    </section>
  </aside>
</main>
<footer><span id="league">league</span><span id="mode">websocket</span></footer>
<div class="burst" id="burst"></div>

<script>
(() => {
  const code = location.pathname.split('/').filter(Boolean).pop().toUpperCase();
  document.getElementById('code').textContent = code;
  const $ = id => document.getElementById(id);
  const status = (text, live) => { $('status').textContent = text; $('status').classList.toggle('live', !!live); };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let currentFightId = null, playToken = 0, socket = null, pollTimer = null;

  const statRows = f => `
    <div><span>Attack</span><b>${f.attack}</b></div><div><span>Defense</span><b>${f.defense}</b></div>
    <div><span>Speed</span><b>${f.speed}</b></div><div><span>Focus</span><b>${f.focus}</b></div>
    <div><span>Recover</span><b>${(f.recovery_milli / 1000).toFixed(1)}/t</b></div><div><span>HP</span><b>${f.hp_max}</b></div>
    ${f.first_strike ? '<div class="tag">⚡ first strike</div>' : ''}${f.crash_turn ? `<div class="tag">🍬 crash on turn ${f.crash_turn}</div>` : ''}`;

  function setFighter(id, f, hp) {
    const el = $(id);
    el.className = `card fighter ${id === 'fa' ? 'side-a' : 'side-b'}`;
    el.querySelector('.emoji').textContent = f.emoji;
    el.querySelector('.name').textContent = f.name;
    el.querySelector('.stats').innerHTML = statRows(f);
    setHP(id, hp, f.hp_max);
  }
  function setHP(id, hp, max) {
    const el = $(id), bar = el.querySelector('.hp');
    bar.style.width = Math.max(0, 100 * hp / max) + '%';
    bar.classList.toggle('low', hp / max < 0.3);
    el.querySelector('.hpnum').textContent = `${hp} / ${max}`;
    if (hp <= 0) el.classList.add('ko');
  }
  function flash(id) { const el = $(id); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit'); }
  function say(text, cls) { const c = $('callout'); c.className = 'callout ' + (cls || ''); c.textContent = text; if (cls === 'pop') { c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); } }

  // The newest line types itself in; older lines stay put.
  function addLine(t) {
    const row = document.createElement('div');
    row.className = t.actor;
    $('log').querySelectorAll('.latest').forEach(n => n.classList.remove('latest'));
    row.classList.add('latest');
    const turn = document.createElement('span'); turn.className = 'turn'; turn.textContent = `t${t.turn}`;
    const text = document.createElement('span'); const cursor = document.createElement('span'); cursor.className = 'cursor';
    row.append(turn, text, cursor); $('log').appendChild(row); $('log').scrollTop = $('log').scrollHeight;
    if (reduceMotion) { text.textContent = t.note; cursor.remove(); return; }
    let i = 0; const tick = setInterval(() => { text.textContent = t.note.slice(0, ++i); if (i >= t.note.length) { clearInterval(tick); cursor.remove(); } }, 14);
  }

  function burst() {
    if (reduceMotion) return;
    const colors = ['#87d68d', '#bcebcb', '#93b48b', '#8491a3'];
    for (let i = 0; i < 40; i++) {
      const dot = document.createElement('i');
      const angle = Math.random() * Math.PI * 2, dist = 160 + Math.random() * 260;
      dot.style.background = colors[i % colors.length];
      dot.style.setProperty('--dx', Math.cos(angle) * dist + 'px'); dot.style.setProperty('--dy', Math.sin(angle) * dist + 180 + 'px');
      $('burst').appendChild(dot); setTimeout(() => dot.remove(), 1400);
    }
  }

  async function playFight(fight) {
    const token = ++playToken;
    currentFightId = fight.fight_id;
    setFighter('fa', fight.a, fight.a.hp_max); setFighter('fb', fight.b, fight.b.hp_max);
    $('log').innerHTML = ''; say(`${fight.a.name} vs ${fight.b.name}`);
    const interval = Math.min(900, Math.max(250, 20000 / Math.max(1, fight.turns.length)));
    for (const t of fight.turns) {
      await new Promise(r => setTimeout(r, interval));
      if (token !== playToken) return;
      addLine(t); setHP('fa', t.a_hp, fight.a.hp_max); setHP('fb', t.b_hp, fight.b.hp_max);
      const target = t.actor === 'a' ? 'fb' : 'fa';
      if (t.action === 'hit') { flash(target); say(`−${t.damage}`, 'pop'); }
      if (t.action === 'miss') say('miss');
      if (t.action === 'crash') { $(t.actor === 'a' ? 'fa' : 'fb').classList.add('crash'); say('Sugar crash: speed halved', 'crash'); }
      if (t.action === 'recover') say(t.note);
    }
    if (token !== playToken) return;
    const winner = fight.winner_id === fight.a.player_id ? fight.a : fight.b;
    say(`${winner.emoji} ${winner.name} wins`, 'win'); burst(); loadLeague();
  }

  async function loadLeague() {
    const res = await fetch(`/leagues/${code}`); if (!res.ok) { status('unknown league'); return; }
    const league = await res.json();
    $('league').textContent = `${league.name} · week of ${league.week_start}`;
    $('standings').innerHTML = league.standings.map(s =>
      `<div class="row"><span class="rank">${s.rank}</span><span>${s.emoji}</span><span>${s.name}</span><span class="wins">${s.wins}W<small>${s.damage} dmg</small></span></div>`).join('');
    $('tonight').innerHTML = '<div>Tonight at 9pm</div>' + league.tonight.map(m => `<div>${m.a.emoji} ${m.a.name} vs ${m.b ? m.b.emoji + ' ' + m.b.name : 'bye'}</div>`).join('');
  }
  async function loadLatest() {
    const res = await fetch(`/leagues/${code}/latest-fight`); if (!res.ok) return;
    const fight = await res.json(); if (fight.fight_id !== currentFightId) playFight(fight);
  }
  function startPolling() { if (pollTimer) return; $('mode').textContent = 'polling every 2s'; pollTimer = setInterval(loadLatest, 2000); }
  function connectSocket() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    socket = new WebSocket(`${proto}://${location.host}/ws/league/${code}`);
    let ping = null;
    socket.onopen = () => { status('live', true); $('mode').textContent = 'websocket'; ping = setInterval(() => socket.send('ping'), 15000); };
    socket.onmessage = ev => { const msg = JSON.parse(ev.data);
      if (msg.type === 'fight_ended' && msg.fight.fight_id !== currentFightId) playFight(msg.fight);
      if (msg.type === 'fighter_update') loadLeague(); };
    socket.onclose = () => { status('reconnecting'); clearInterval(ping); startPolling(); setTimeout(connectSocket, 5000); };
    socket.onerror = () => socket.close();
  }
  loadLeague(); loadLatest(); connectSocket();
})();
</script>
</body>
</html>
